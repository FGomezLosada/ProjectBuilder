name: "Idea o mejora / Feature request"
description: "Propón una función nueva o un cambio / Suggest a new feature or change"
labels: ["mejora"]
body:
  - type: textarea
    id: idea
    attributes:
      label: "¿Qué te gustaría? / What would you like?"
    validations:
      required: true
  - type: textarea
    id: para
    attributes:
      label: "¿Para qué lo usarías? / What would you use it for?"
